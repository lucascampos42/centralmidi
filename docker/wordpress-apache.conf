<Directory /var/www/>
	Options Indexes FollowSymLinks
	AllowOverride All
	Require all granted
	LimitRequestBody 0
</Directory>

<Directory /var/www/html/midis/>
	Options -Indexes +FollowSymLinks
	AllowOverride All
	Require all granted
	<IfModule mod_headers.c>
		Header set Access-Control-Allow-Origin "*"
		Header set Accept-Ranges bytes
	</IfModule>
</Directory>