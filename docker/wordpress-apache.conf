<Directory /var/www/>
	Options Indexes FollowSymLinks
	AllowOverride All
	Require all granted
	LimitRequestBody 0
</Directory>

<Directory /var/www/html/midis/>
	Options -Indexes +FollowSymLinks
	AllowOverride All
	Require all granted
	<IfModule mod_rewrite.c>
		# Roteia a página /midis/ (catálogo WordPress) para o WP; a pasta física
		# /midis/ (uploads do importador) não deve sombrear a página.
		RewriteEngine On
		RewriteBase /
		RewriteRule ^/?$ /index.php [L]
	</IfModule>
	<IfModule mod_headers.c>
		Header set Access-Control-Allow-Origin "*"
		Header set Accept-Ranges bytes
	</IfModule>
</Directory>